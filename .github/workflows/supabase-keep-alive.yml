# Keeps the Supabase project from being paused for inactivity.
#
# A free Supabase project sleeps after about a week without API traffic, and
# the whole site's content goes with it. vercel.json also runs this through a
# Vercel cron, but a Hobby plan only allows one cron run a day; this workflow
# adds a few checks in between so a single missed run is never the difference.
#
# Needs the repository variable SITE_URL (Settings > Secrets and variables >
# Actions > Variables), for example https://modtechworld.com. Without it the
# job reports that and stops instead of failing loudly every six hours.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the keep-alive endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL repository variable is not set - skipping."
            exit 0
          fi
          endpoint="${SITE_URL%/}/api/keep-alive"
          echo "Calling $endpoint"
          for attempt in 1 2 3; do
            code=$(curl -sS -o response.json -w "%{http_code}" --max-time 30 "$endpoint" || echo "000")
            echo "Attempt $attempt -> HTTP $code"
            cat response.json || true
            echo
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 20
          done
          echo "Supabase keep-alive did not succeed after 3 attempts."
          exit 1
